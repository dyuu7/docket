name: 🐛 Bug Report
description: Report a problem with a manifest or its installation behavior.
title: "[Bug]: "
labels: ["bug"]
body:
- type: checkboxes
  attributes:
    label: Prerequisites
    options:
    - label: I have searched existing issues and pull requests.
      required: true
    - label: I am using the latest version of Scoop and the latest docket bucket.
      required: true
- type: input
  attributes:
    label: Package Name
    description: The manifest or install name that is affected.
    placeholder: e.g. Starward
  validations:
    required: true
- type: input
  attributes:
    label: Package Version
    description: Version shown by Scoop, if installed.
    placeholder: e.g. 0.18.2
  validations:
    required: false
- type: textarea
  attributes:
    label: Problem
    description: Describe what you expected and what happened instead.
    placeholder: The install completed, but the application does not start because...
  validations:
    required: true
- type: textarea
  attributes:
    label: Steps to Reproduce
    description: Include the commands you ran and relevant command output.
    render: console
    placeholder: |
      scoop bucket add docket https://github.com/dyuu7/docket
      scoop install docket/<package>
      # Paste the relevant output here.
  validations:
    required: true
- type: textarea
  attributes:
    label: Relevant Manifest Fields
    description: If known, include the URL, architecture, or manifest field involved.
    placeholder: The 32-bit URL appears to point to the x64 archive.
  validations:
    required: false
- type: textarea
  attributes:
    label: Environment
    description: Include Scoop and PowerShell versions when relevant.
    render: console
    placeholder: |
      scoop --version
      $PSVersionTable
  validations:
    required: false
- type: textarea
  attributes:
    label: Additional Context
    description: Add logs, screenshots, or links to the relevant upstream release.
  validations:
    required: false
