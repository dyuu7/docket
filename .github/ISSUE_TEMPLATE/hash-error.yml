name: 🔢 Hash Error
description: Report a hash mismatch for a package download.
title: "[Hash]: "
labels: ["bug"]
body:
- type: checkboxes
  attributes:
    label: Prerequisites
    options:
    - label: I am using the latest version of Scoop and the latest docket bucket.
      required: true
    - label: I have retried the download and confirmed the mismatch is reproducible.
      required: true
- type: input
  attributes:
    label: Package Name
    description: The manifest or install name that reports the mismatch.
    placeholder: e.g. Fanhuaji
  validations:
    required: true
- type: input
  attributes:
    label: Version and Architecture
    description: Include the version and architecture selected by Scoop.
    placeholder: e.g. 1.6.0, 32bit
  validations:
    required: true
- type: textarea
  attributes:
    label: Hash Error
    description: Paste the complete Scoop output, including the download URL and expected hash.
    render: console
    placeholder: |
      scoop install docket/<package>
      # Paste the complete hash mismatch output here.
  validations:
    required: true
- type: textarea
  attributes:
    label: Additional Context
    description: Include a release link or a separately calculated SHA-256 if available.
  validations:
    required: false
