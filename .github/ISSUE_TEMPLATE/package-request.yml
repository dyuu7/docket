name: 📦 Package Request
description: Open an issue about a missing package.
title: "[Request]: "
labels: ["package-request"]
body:
- type: checkboxes
  attributes:
    label: Prerequisites
    options:
    - label: I have searched all issues/PRs to ensure it has not already been reported or fixed.
      required: true
- type: checkboxes
  attributes:
    label: Request criteria
    description: Please confirm that the request fits this personal bucket.
    options:
    - label: An official Windows release and a direct upstream download source are available.
      required: true
    - label: The package is maintained, or the requested release is stable and reproducible.
      required: true
    - label: The request includes enough information to identify the application and its upstream project.
      required: true
- type: input
  attributes:
    label: Name
    description: Name of the package
  validations:
    required: true
- type: input
  attributes:
    label: Description
    description: Clear and concise details of what it is
  validations:
    required: true
- type: input
  attributes:
    label: Homepage
    description: URI of the package's homepage
  validations:
    required: true
- type: input
  attributes:
    label: Download Link(s)
    description: Direct URI(s) of the official package download(s), if known.
  validations:
    required: true
- type: textarea
  attributes:
    label: Upstream status and additional context
    description: Share the release page, latest version, maintenance status, or any other useful context.
  validations:
    required: false
